<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORIENTO – assistenza e formazione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230066CC'/%3E%3Cpath d='M16 6l4 10-4 10-4-10z' fill='white'/%3E%3C/svg%3E">

<header class="topbar">

    <div>
      <div class="brand-name">ORIENTO</div>
      <div class="brand-sub">Assistenza e formazione per gli operatori comunali</div>
    </div>
  </div>
  <div class="top-right">
    <span id="ai-pill" class="pill">…</span>
    <label class="who">
      <span class="sr">Profilo in uso</span>
      <select id="who"></select>
    </label>
    <button id="btn-settings" class="icon-btn" title="Impostazioni demo" aria-label="Impostazioni demo">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.3-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </div>
</header>
<div id="banner"></div>
<div class="layout">
  <nav id="nav" class="nav"></nav>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div class="footnote">Prototipo dimostrativo – Hackathon Palitalsoft × UNICAM 2026. Operatori, ente e richieste sono <b>fittizi</b>. Contenuti tratti dalla documentazione Palitalsoft fornita per l'hackathon.</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <button class="modal-close" aria-label="Chiudi">×</button>

  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>

</html>
